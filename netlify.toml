# Netlify-configuratie — Prestige Automotive
# Zie docs/NETLIFY-DEPLOY.md.
#
# De site is platte HTML zonder build-stap: Netlify publiceert de repo-root
# zoals hij is. Wat in .gitignore staat (_legacy-squarespace, docs, .claude)
# zit niet in de repo en komt dus ook niet op Netlify terecht.

[build]
  publish = "."
  functions = "netlify/functions"
  # Geen build-commando: er valt niets te bouwen.
  command = ""

# ── Contactformulier ──
# contact.html post naar /api/contact. Deze regel stuurt dat door naar de
# Netlify Function, zodat de HTML identiek blijft aan de andere hostings.
# status 200 = interne rewrite, geen redirect: de browser blijft op /api/contact.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# ── Instagram-feed ──
# /api/instagram/connect is de link die de klant krijgt om Instagram te
# koppelen; Instagram stuurt daar ook naar terug na het goedkeuren.
[[redirects]]
  from = "/api/instagram/connect"
  to = "/.netlify/functions/instagram-connect"
  status = 200
  force = true

# galerij.html leest /api/instagram. De berichten komen uit Netlify Blobs,
# dagelijks gevuld door de scheduled function instagram-sync.
[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200
  force = true

# ── Bestanden die in de repo staan maar niet op het web horen ──
# Omdat publish = "." wordt álles in de repo-root mee gepubliceerd.
# force = true is hier essentieel: zonder force slaat Netlify een regel over
# zodra er op dat pad een echt bestand bestaat — en dat is hier precies het
# geval. (Tot 2026-10 ontbrak force en waren deze bestanden wél publiek.)

# De PHP-variant hoort alleen op Combell thuis. Netlify voert geen PHP uit en
# zou de broncode als platte tekst serveren; dit blokkeert dat.
# (Netlify kent geen wildcard midden in een pad, dus de bestandsnaam voluit.)
[[redirects]]
  from = "/api/contact.php"
  to = "/index.html"
  status = 404
  force = true

# De deploy-scripts voor Combell horen niet op het web. Ze bevatten geen
# wachtwoorden — die komen uit environment variables — maar er is geen reden
# om ze te publiceren.
[[redirects]]
  from = "/deploy/*"
  to = "/index.html"
  status = 404
  force = true

# Interne documentatie staat sinds kort wél in git (zodat het rollback-plan en
# de DNS-back-up niet enkel op één laptop leven), maar hoort niet op het web:
# het bevat infrastructuurdetails en de prijslijst-PDF van de klant.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

# Broncode van de functions en hun npm-afhankelijkheden. Netlify installeert
# node_modules tijdens de build in de repo-root, dus ook die zou anders
# gepubliceerd worden.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Afbeeldingen mogen lang gecacht blijven; ze wijzigen zelden en hebben een
# vaste bestandsnaam.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# CSS en JS korter, zodat een aanpassing snel zichtbaar is.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
